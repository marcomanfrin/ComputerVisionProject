name: cv-project
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.13
  - pip

  # Core scientific stack
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib>=3.7.0
  - scikit-learn>=1.3.0
  - scipy>=1.11.0

  # Computer Vision
  - opencv>=4.8.0
  - pillow>=10.0.0

  # Deep Learning (PyTorch via pytorch channel)
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - torchaudio>=2.1.0
  - cpuonly  # remove this line and add cudatoolkit=11.8 if using GPU

  # Notebooks
  - jupyter
  - ipywidgets

  # Utilities
  - tqdm
  - pyyaml
  - python-dotenv

  - pip:
    - black>=23.0.0
    - flake8>=6.1.0
    - pytest>=7.4.0
